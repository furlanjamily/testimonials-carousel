<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="src/css/styles.css" />
  </head>
  <body>
    <div class="launch-product">
      <div class="title">
        <h1>Lançamentos</h1>
      </div>

      <div class="swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
              <div class="product-img">
                <img
                  src="src/images/imgCarrosel.png"
                  alt="Imagem Demonstrativa"
                />
              </div>

              <div class="product-info">
                <div class="price-discount-line">
                  <div class="prices">
                    <p class="old-price">R$ 100,00</p>
                    <p class="new-price">R$79,90</p>
                  </div>
                  <div class="discount">
                    <p>10% off</p>
                  </div>

                </div>
                <div class="installments">
                  <p>Ou em até 10x de R$ 7,90</p>
                </div>
              </div>
              
              <div class="button-buy">
                <button class="">Comprar</button>
              </div>
            
          </div>
        </div>
        <div class="swiper-pagination"></div>

        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="src/javascript/script.js"></script>
  </body>
</html>
